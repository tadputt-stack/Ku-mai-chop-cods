<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- favicon+webname -->
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <title>Free2Pay</title>

    <!-- css -->
    <link rel="stylesheet" href="../css/login.css">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="haed-file-login">
    </div><!-- อันนี้เป็นที่มันยื้นบอกหมวด โฟลเดอร์ login ขนาดมันเล็กกว่าที่ออยู่หน้า home เลยแยกกัน -->

    <div class="file-login">

        <img src="../images/logoinpage.png" alt="" class="logo-web">

        <div class="box-login">
            <h2 class="head-title">Set up your<br><strong>Identity</strong></h2>

            <div class="login-form">

                <div class="input-group">
                    <input type="email" class="input-field" placeholder="E-mail..." required>
                </div><!-- กรอกอีเมล -->

                <div class="box-password">
                    <div class="your-password">
                        <input type="password" class="input-field input-pass" placeholder="Password..." required>
                        <div class="pass-actions">
                            <a href="#" class="forgot-link">Forgot Password?</a>
                            <button type="button" class="btn-eye" title="แสดง/ซ่อนรหัสผ่าน">
                                <i class="fa-solid fa-eye-slash"></i>
                            </button>
                        </div>
                    </div><!-- กรอกรหัสผ่าน -->

                    <div class="social-login">
                        <a href="#" class="social-icon" title="Phone"><i class="fa-solid fa-phone"></i></a>
                        <a href="#" class="social-icon" title="Google"><i class="fa-brands fa-google"></i></a>
                        <a href="#" class="social-icon" title="Facebook"><i
                                class="fa-brands fa-square-facebook"></i></a>
                    </div>
                </div><!-- เข้าสู่ระบบช่องทางอื่น -->


                <div class="login-btn-wrap">
                    <button type="submit" class="btn-login">log-in</button>
                </div><!-- ปุ่ม Login -->

            </div><!-- เข้าสู่ระบบ -->

            <div class="login-line"></div><!-- เส้นคั่น -->


            <div class="interest-section">

                <h3 class="interest-title">ฉันสนใจจจ ?</h3>

                <div class="interest-tags">
                    <div class="tags-row">
                        <button type="button" class="login-tag">UXUI Design</button>
                        <button type="button" class="login-tag">Digital Art</button>
                        <button type="button" class="login-tag">UX/UI Design</button>
                        <button type="button" class="login-tag">Handmade</button>
                    </div>
                    <div class="tags-row">
                        <button type="button" class="login-tag">Graphic Design</button>
                        <button type="button" class="login-tag">Traditional Art</button>
                    </div>
                </div><!-- หมวดหมู่ที่เลือกได้ว่ามีงานประเภทออะไรบ้าง จ้าง/ดูงานแนวไหนได้บ้าง -->

            </div>

        </div>

    </div><!-- แฟ้มข้างในของโฟลเดอร์สีน้ำเงินมืด -->

    <div class="choose">
        <div class="choose-container">

            <div class="choose-title">
                <span><svg class="tri" width="30" height="26" viewBox="0 0 30 26" aria-hidden="true">
                        <path d="M4 4h22L15 22z" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round" />
                    </svg> ฉันเป็น ?</span>
            </div>

            <div class="choose-roles">
                <button type="button" class="role-pill">บุคคลที่สนใจในศิลปะ</button>
                <button type="button" class="role-pill">ผู้ว่าจ้าง</button>
                <button type="button" class="role-pill">นักออกแบบ</button>
            </div><!-- ปุ่มเลือกว่า user เข้ามาในหน้าที่ไหน -->
        </div>
    </div><!-- กล่องเลือกroleของuser -->


</body>

</html>
