        <a href="../page/index.html">

    <div class="haed-file-login">
    </div><!-- อันนี้เป็นที่มันยื้นบอกหมวด โฟลเดอร์ login ขนาดมันเล็กกว่าที่ออยู่หน้า home เลยแยกกัน -->

    <div class="file-login">

        <img src="../images/logoinpage.png" alt="" class="logo-web">

        <div class="box-login">
            <h2 class="head-title">Set up your<br>Identity</h2>

            <div class="login-form">

                <div class="input-group">
                    <input type="email" class="input-field" placeholder="E-mail..." required>
                </div><!-- กรอกอีเมล -->

                <div class="box-password">
                    <div class="your-password">
                        <input type="password" class="input-field input-pass" placeholder="Password..." required>
                        <div class="pass-actions">
                            <a href="#" class="forgot-link">Forgot Password?</a>
                            <button type="button" class="btn-eye" title="แสดง/ซ่อนรหัสผ่าน">
                                <i class="fa-regular fa-eye-slash"></i>
                            </button>
                        </div>
                    </div><!-- กรอกรหัสผ่าน -->

                    <div class="social-login">
                        <a href="#" class="social-icon" title="Phone"><i class="fa-solid fa-phone"></i></a>
                        <a href="#" class="social-icon" title="Google"><i class="fa-brands fa-google"></i></a>
                        <a href="#" class="social-icon" title="Facebook"><i
                                class="fa-brands fa-square-facebook"></i></a>
                    </div>
                </div><!-- เข้าสู่ระบบช่องทางอื่น -->


                <div class="login-btn-wrap">
                    <button type="submit" class="btn-login">log-in</button>
                </div><!-- ปุ่ม Login -->

            </div><!-- เข้าสู่ระบบ -->

            <div class="login-line"></div><!-- เส้นคั่น -->


            <div class="interest-section">

                <h3 class="interest-title">ฉันสนใจจจ ?</h3>

                <div class="interest-tags">
                    <div class="tags-row">
                        <button type="button" class="tag-pill">UXUI Design</button>
                        <button type="button" class="tag-pill">Digital Art</button>
                        <button type="button" class="tag-pill">Painting</button>
                        <button type="button" class="tag-pill">Handmade</button>
                    </div>
                    <div class="tags-row">
                        <button type="button" class="tag-pill">Graphic Design</button>
                        <button type="button" class="tag-pill">Traditional Art</button>
                    </div>
                </div><!-- หมวดหมู่ที่เลือกได้ว่ามีงานประเภทออะไรบ้าง จ้าง/ดูงานแนวไหนได้บ้าง -->

            </div>

        </div>

    </div><!-- แฟ้มข้างในของโฟลเดอร์สีน้ำเงินมืด -->

    <div class="choose">
        <div class="choose-container">

            <div class="choose-title">
                <i class="fa-regular fa-sort-down"></i>
                <span>ฉันเป็น ?</span>
            </div>

            <div class="choose-roles">
                <button type="button" class="role-pill">บุคคลที่สนใจในศิลปะ</button>
                <button type="button" class="role-pill">ผู้ว่าจ้าง</button>
                <button type="button" class="role-pill">นักออกแบบ</button>
            </div><!-- ปุ่มเลือกว่า user เข้ามาในหน้าที่ไหน -->
        </div>
    </div><!-- กล่องเลือกroleของuser -->
